name: 학사일정 자동 갱신

on:
  schedule:
    - cron: '30 18 * * 0'  # 매주 월요일 03:30 KST (일요일 18:30 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r scripts/requirements.txt

      - name: 전국 학교 학사일정 수집 (학년도 전체)
        run: python scripts/fetch_school_schedule.py --workers 6 --refresh
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _rawdata/schedule.json
          git diff --cached --quiet || git commit -m "chore: 학사일정 자동 갱신 $(date +'%Y-%m-%d')"
          git push
