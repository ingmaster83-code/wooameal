name: 급식 정보 자동 갱신

on:
  schedule:
    - cron: '0 17 * * *'  # 매일 새벽 2시 KST (UTC 17시)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r scripts/requirements.txt

      - name: 급식 캐시 초기화 (매일 최근 구간으로 전체 재수집)
        run: rm -f _rawdata/meal_detail.json

      - name: 전국 학교 급식정보 수집 (최근 60일~향후 75일)
        run: python scripts/fetch_school_meal.py
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}

      - name: 페이지용 데이터 재생성
        run: python scripts/process_data.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _rawdata/ search_index.json
          git diff --cached --quiet || git commit -m "chore: 급식정보 자동 갱신 $(date +'%Y-%m-%d')"
          git push
